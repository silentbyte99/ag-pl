server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: agri-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agri_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: 'now()'
      logic-not-delete-value: 'null'

logging:
  level:
    com.agri.backend: debug

jwt:
  secret: agri-platform-jwt-secret-key-please-change-in-production-2024
  expiration: 604800000